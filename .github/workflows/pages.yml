# Veroeffentlicht den Klickdummy unter prototype/ als statische Seite.
# Kein Build-Schritt: Die Seite laeuft ohne Werkzeugkette, auch per Doppelklick.
name: Prototyp veröffentlichen

on:
  push:
    branches: ["main"]
  # Die Pruefung laeuft auch am Pull Request. Sonst faellt ein Fehler erst
  # nach dem Merge auf, und die Vorschau zeigt einen kaputten Stand.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Die Gruppe enthaelt die Referenz, damit ein Prueflauf am Pull Request nicht
# hinter einer laufenden Veroeffentlichung aus main wartet. Zwei Laeufe aus
# main teilen weiterhin dieselbe Gruppe und serialisieren wie vorgesehen.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Vorgelagert: Was nicht durch die Pruefung kommt, wird nicht veroeffentlicht.
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Erzeugte Vokabulardateien gegen ihre Quelle prüfen
        run: node tools/vokabular-einbetten.mjs --pruefen
      - name: Beispieldatensatz gegen Schema und Vokabulare prüfen
        run: node tools/validate.mjs

  deploy:
    needs: pruefen
    # Veroeffentlicht wird nur aus main. Am Pull Request prueft der Lauf
    # lediglich, ohne die Seite anzufassen.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Nur den Klickdummy veröffentlichen: Er liegt damit unter der
          # Wurzel der Pages-Adresse und ist per Link teilbar.
          path: './prototype'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
